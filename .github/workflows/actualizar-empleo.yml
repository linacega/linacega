name: Actualizar CEGALAB Empleo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actualizar-empleo.yml'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar landing
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          repls = {
            'CEGALAB Empleo IA: asesoría personalizada para optimizar LinkedIn, CV, búsqueda de trabajo con inteligencia artificial, networking, entrevistas y seguimiento.': 'CEGALAB Empleo IA: optimización SEO de LinkedIn, CV estratégico, inteligencia artificial, networking y una estrategia clara para buscar trabajo.',
            'LinkedIn, CV, IA, networking, plataformas de empleo y preparación de entrevistas en una ruta práctica y medible.': 'SEO de LinkedIn, CV, IA, networking y estrategia de búsqueda de empleo en una ruta práctica y medible.',
            'Convertimos tu búsqueda de empleo en una estrategia profesional: posicionamiento, LinkedIn, CV, inteligencia artificial, networking, plataformas, entrevistas y seguimiento con métricas.': 'Convertimos tu búsqueda de empleo en una estrategia clara y ejecutable: definimos los cargos objetivo, optimizamos el SEO de tu perfil de LinkedIn para mejorar tu descubrimiento en búsquedas, fortalecemos tu CV, usamos IA para adaptar candidaturas y construimos un sistema de networking, aplicaciones y seguimiento.',
            '<span class="chip">LinkedIn</span><span class="chip">CV estratégico</span><span class="chip">ChatGPT + IA</span><span class="chip">Networking</span><span class="chip">Entrevistas</span><span class="chip">Trabajo remoto</span>': '<span class="chip">SEO en LinkedIn</span><span class="chip">CV estratégico</span><span class="chip">ChatGPT + IA</span><span class="chip">Networking</span><span class="chip">Entrevistas</span><span class="chip">Trabajo remoto</span>',
            '<div class="p-card"><b>2. Perfil</b><span>LinkedIn, titular, Acerca de, experiencia, habilidades, evidencia, visibilidad y palabras clave.</span></div>': '<div class="p-card"><b>2. Perfil + SEO LinkedIn</b><span>Investigación de cargos y palabras clave, titular, Acerca de, experiencia, habilidades, ubicación, Open to Work, visibilidad y coherencia semántica para aparecer mejor en búsquedas relevantes.</span></div>',
            '<article class="service-card"><div class="service-icon">LI</div><h3>LinkedIn que te posicione</h3><p style="color:var(--muted)">Reescribimos el perfil para que comunique especialidad, valor y evidencia con claridad.</p><ul><li>Titular estratégico</li><li>Acerca de</li><li>Experiencia y logros</li><li>Habilidades y palabras clave</li><li>Open to Work y visibilidad</li></ul></article>': '<article class="service-card"><div class="service-icon">SEO</div><h3>SEO y posicionamiento en LinkedIn</h3><p style="color:var(--muted)">Optimizamos tu perfil para que sea más claro para personas y más relevante en búsquedas de recruiters y empresas, sin llenar el perfil de palabras clave como si fuera una sopa de etiquetas.</p><ul><li>Definición de 1–3 cargos objetivo</li><li>Mapa de palabras clave por cargo y sector</li><li>Titular profesional orientado a búsquedas</li><li>Acerca de con propuesta de valor</li><li>Experiencia escrita con logros y términos relevantes</li><li>Habilidades, ubicación, Open to Work y visibilidad</li><li>Revisión de apariciones en búsquedas para iterar</li></ul></article>',
            '.route{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}': '.route{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}',
            '<h2 class="section-title">10 semanas para construir, probar y mejorar tu sistema de búsqueda.</h2>': '<h2 class="section-title">Una estrategia simple en 4 pasos para dejar de buscar empleo al azar.</h2>',
            '<p class="section-lead">No prometemos “empleo en 10 semanas”. Prometemos algo menos mágico y bastante más útil: una metodología que puedas medir y mejorar.</p>': '<p class="section-lead">La asesoría no consiste en acumular reuniones. Organizamos lo esencial, dejamos los activos listos y te damos un sistema que puedes ejecutar por tu cuenta durante las siguientes semanas.</p>',
            '<h2 class="section-title">Paga por claridad y ejecución, no por una carpeta llena de PDFs.</h2>': '<h2 class="section-title">Planes simples, pocos encuentros y entregables concretos.</h2>',
            '<p class="section-lead">Todos los planes son personalizados. Los valores son de lanzamiento y pueden ajustarse según seniority, búsqueda internacional o complejidad del perfil.</p>': '<p class="section-lead">La mayor parte del valor está en el diagnóstico, la optimización y la estrategia, no en multiplicar sesiones. Por eso cada plan tiene pocos encuentros y una lista clara de lo que queda listo.</p>',
            '<ul><li>Sesión 75–90 min</li><li>Scorecard 6P</li><li>Auditoría LinkedIn + CV</li><li>Prioridades de mejora</li><li>Plan de 30 días</li></ul>': '<ul><li>1 encuentro de 60–75 min</li><li>Diagnóstico de posicionamiento</li><li>Auditoría de LinkedIn + CV</li><li>Revisión de SEO y palabras clave</li><li>3 prioridades de mejora</li><li>Plan de acción de 30 días</li></ul>',
            '<div class="tag">Posicionamiento</div><h3>LinkedIn + CV + IA</h3><p>Para renovar tu presentación profesional y aprender a adaptarla.</p><div class="price">$349.000 <small>COP</small></div>': '<div class="tag">Posicionamiento</div><h3>LinkedIn SEO + CV</h3><p>Para quedar bien posicionado y con documentos listos para aplicar a cargos concretos.</p><div class="price">$349.000 <small>COP</small></div>',
            '<ul><li>3 sesiones</li><li>Perfil LinkedIn completo</li><li>CV maestro</li><li>Primera versión adaptada</li><li>Banco de logros</li><li>Biblioteca de prompts</li></ul>': '<ul><li>1 encuentro estratégico de hasta 90 min</li><li>Definición de cargos objetivo</li><li>Mapa de palabras clave</li><li>Optimización SEO completa de LinkedIn</li><li>Titular, Acerca de, experiencia y habilidades</li><li>CV maestro orientado a logros</li><li>1 CV adaptado a una vacante real</li><li>Prompts de IA para futuras adaptaciones</li></ul>',
            'Hola%20CEGALAB%2C%20me%20interesa%20el%20plan%20LinkedIn%20%2B%20CV%20%2B%20IA.': 'Hola%20CEGALAB%2C%20me%20interesa%20el%20plan%20LinkedIn%20SEO%20%2B%20CV.',
            '<div class="tag">Más completo</div><h3>Ruta Empleo IA</h3><p>El sistema completo para buscar, conectar, aplicar y medir.</p><div class="price">$699.000 <small>COP</small></div>': '<div class="tag">Más completo</div><h3>Estrategia Empleo IA</h3><p>Para salir con tu posicionamiento listo y una estrategia completa de búsqueda, networking y seguimiento.</p><div class="price">$699.000 <small>COP</small></div>',
            '<ul><li>6 sesiones</li><li>Todo LinkedIn + CV + IA</li><li>Networking y mensajes</li><li>Mapa de empresas objetivo</li><li>Tracker de oportunidades</li><li>Preparación de entrevistas</li><li>Seguimiento del embudo</li></ul>': '<ul><li>2 encuentros estratégicos</li><li>Todo el plan LinkedIn SEO + CV</li><li>Estrategia de búsqueda por cargos y canales</li><li>Mapa de empresas objetivo</li><li>Networking: a quién contactar y qué escribir</li><li>Alertas y plataformas recomendadas</li><li>Tracker de aplicaciones y seguimiento</li><li>IA para analizar vacantes y adaptar candidaturas</li><li>Preparación base para entrevistas</li></ul>',
            'Hola%20CEGALAB%2C%20me%20interesa%20la%20Ruta%20Empleo%20IA.': 'Hola%20CEGALAB%2C%20me%20interesa%20la%20Estrategia%20Empleo%20IA.',
            '<div class="tag">Ejecutivo</div><h3>Career Accelerator</h3><p>Para managers, ejecutivos, transición de carrera o búsqueda internacional.</p><div class="price">$1.190.000 <small>COP</small></div>': '<div class="tag">Ejecutivo</div><h3>Reposicionamiento Ejecutivo</h3><p>Para managers, líderes, transición de carrera o búsqueda remota e internacional.</p><div class="price">$1.190.000 <small>COP</small></div>',
            '<ul><li>8 sesiones</li><li>Reposicionamiento profundo</li><li>Búsqueda internacional/remota</li><li>Casos y entrevistas avanzadas</li><li>Revisión de procesos reales</li><li>Negociación de oferta</li></ul>': '<ul><li>3 encuentros estratégicos</li><li>Definición de narrativa y propuesta de valor ejecutiva</li><li>SEO LinkedIn y perfil ejecutivo completo</li><li>CV ejecutivo + versión internacional si aplica</li><li>Estrategia de headhunters, recruiters y networking</li><li>Mapa de empresas y oportunidades objetivo</li><li>Preparación de entrevistas de liderazgo</li><li>Revisión de procesos reales y negociación</li></ul>',
            'Hola%20CEGALAB%2C%20me%20interesa%20el%20Career%20Accelerator.': 'Hola%20CEGALAB%2C%20me%20interesa%20el%20Reposicionamiento%20Ejecutivo.',
            '<details><summary>¿Cómo se realizan las sesiones?</summary><p>Virtuales. Cada plan incluye entregables y tareas de implementación. El objetivo es que termines sabiendo ejecutar el sistema sin depender permanentemente del asesor.</p></details>': '<details><summary>¿Qué significa optimizar el SEO de mi perfil de LinkedIn?</summary><p>Significa alinear tu perfil con los cargos que realmente buscas: identificar términos relevantes, incorporarlos de forma natural en titular, Acerca de, experiencia y habilidades, configurar correctamente preferencias y visibilidad, y revisar tus apariciones en búsquedas para mejorar con datos. No se trata de repetir palabras clave sin sentido.</p></details>\n          <details><summary>¿Cómo se realizan los encuentros?</summary><p>Son virtuales y concentrados. Trabajamos con pocos encuentros porque la asesoría está diseñada alrededor de entregables y una estrategia ejecutable, no alrededor de acumular horas de reunión.</p></details>'
          }
          for old, new in repls.items():
              if old not in s:
                  print('No encontrado:', old[:80])
              s = s.replace(old, new)

          old_route = '''<div class="route">
          <div class="week"><span>Semana 1</span><b>Objetivo</b><p>Cargos, seniority, sectores, empresas y línea base.</p></div>
          <div class="week"><span>Semana 2</span><b>LinkedIn</b><p>Posicionamiento, keywords, experiencia y visibilidad.</p></div>
          <div class="week"><span>Semana 3</span><b>CV maestro</b><p>Historia profesional, logros y evidencia verificable.</p></div>
          <div class="week"><span>Semana 4</span><b>IA + tailoring</b><p>Analizar vacantes y adaptar documentos con control humano.</p></div>
          <div class="week"><span>Semana 5</span><b>Portafolio</b><p>Casos, proyectos, pruebas y activos profesionales.</p></div>
          <div class="week"><span>Semana 6</span><b>Networking</b><p>Mapa de red, mensajes y conversaciones relevantes.</p></div>
          <div class="week"><span>Semana 7</span><b>Candidaturas</b><p>Alertas, prioridades A/B/C y aplicaciones dirigidas.</p></div>
          <div class="week"><span>Semana 8</span><b>Entrevistas</b><p>Pitch, historias, objeciones y preguntas estratégicas.</p></div>
          <div class="week"><span>Semana 9</span><b>Analítica</b><p>Medir conversión, canales y cuello de botella.</p></div>
          <div class="week"><span>Semana 10</span><b>Siguiente sprint</b><p>Optimizar, negociar o reposicionar según los datos.</p></div>
        </div>'''
          new_route = '''<div class="route">
          <div class="week"><span>Paso 1</span><b>Definir el objetivo</b><p>Elegimos 1–3 cargos objetivo, seniority, sectores, modalidad y empresas para que todo el perfil tenga una dirección concreta.</p></div>
          <div class="week"><span>Paso 2</span><b>Posicionarte</b><p>Optimizamos SEO de LinkedIn, palabras clave, titular, Acerca de, experiencia, habilidades y CV para los cargos definidos.</p></div>
          <div class="week"><span>Paso 3</span><b>Buscar con método</b><p>Configuramos portales, alertas, networking, mensajes, empresas objetivo e IA para analizar y adaptar candidaturas.</p></div>
          <div class="week"><span>Paso 4</span><b>Convertir y medir</b><p>Usas un tracker simple para seguir aplicaciones, conversaciones y entrevistas, identificar el cuello de botella y ajustar.</p></div>
        </div>'''
          if old_route not in s:
              print('Ruta antigua no encontrada')
          s = s.replace(old_route, new_route)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verificar cambios
        run: |
          grep -q 'LinkedIn SEO + CV' index.html
          grep -q 'Estrategia Empleo IA' index.html
          grep -q 'Una estrategia simple en 4 pasos' index.html
          ! grep -q '6 sesiones' index.html
          ! grep -q '8 sesiones' index.html
      - name: Publicar cambios y retirar workflow temporal
        run: |
          rm .github/workflows/actualizar-empleo.yml
          git config user.name 'CEGALAB Bot'
          git config user.email 'hola@cegalab.com'
          git add index.html .github/workflows/actualizar-empleo.yml
          git commit -m 'Simplificar planes y reforzar SEO LinkedIn'
          git push