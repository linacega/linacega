<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101412"><title>CEGALAB CRM</title><style>body{margin:0;background:#101412;color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.load{text-align:center;padding:28px}.dot{width:18px;height:18px;border:3px solid #53605a;border-top-color:#c8f25a;border-radius:50%;margin:16px auto;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}small{color:#aeb7b2}</style></head><body><div class="load"><strong>CEGALAB CRM</strong><div class="dot"></div><small>Cargando sistema comercial…</small></div><script>(async()=>{try{const ps=await Promise.all([1,2,3,4].map(n=>fetch(`payload-${n}.txt`).then(r=>{if(!r.ok)throw Error('Falta un archivo del CRM');return r.text()})));const b64=ps.join('').trim();const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load"><strong>No se pudo cargar el CRM</strong><p>'+e.message+'</p></div>'}})();</script></body></html>
